<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Binary Modem</title>
</head>

<body>

<h1>Audio Binary Modem</h1>

<h2>Settings</h2>

<label>Frequency A (Hz):</label>
<input id="freqA" type="number" value="8000">
<br><br>

<label>Frequency B (Hz):</label>
<input id="freqB" type="number" value="9000">
<br><br>

<label>Frequency used for binary 0:</label>
<select id="zeroFrequency">
    <option value="A">Frequency A</option>
    <option value="B">Frequency B</option>
</select>
<br><br>

<label>Bit duration (ms):</label>
<input id="bitDuration" type="number" value="150">
<br><br>

<label>Detection tolerance (Hz):</label>
<input id="tolerance" type="number" value="100">
<br><br>

<p>
    Binary 0: <span id="zeroDisplay">8000 Hz</span><br>
    Binary 1: <span id="oneDisplay">9000 Hz</span>
</p>

<hr>

<h2>Send</h2>

<label>Text:</label><br>
<textarea id="textToSend" rows="5" cols="50"></textarea>
<br><br>

<button onclick="sendText()">Send</button>
<button onclick="stopSending()">Stop</button>

<p>Status: <span id="sendStatus">Ready</span></p>

<label>Binary:</label><br>
<textarea id="binaryOutput" rows="5" cols="50" readonly></textarea>

<hr>

<h2>Receive</h2>

<button onclick="startReceiving()">
    Start Listening
</button>

<button onclick="stopReceiving()">
    Stop Listening
</button>

<p>
    Detected frequency:
    <span id="detectedFreq">---</span> Hz
</p>

<label>Received Binary:</label><br>
<textarea id="receivedBinary" rows="5" cols="50" readonly></textarea>

<br><br>

<label>Decoded Text:</label><br>
<textarea id="receivedText" rows="5" cols="50" readonly></textarea>

<p>Status: <span id="receiveStatus">
    Microphone not running
</span></p>


<script>

let audioContext = null;
let oscillator = null;
let gainNode = null;
let sending = false;

let receiveContext = null;
let analyser = null;
let microphone = null;
let receiveStream = null;
let receiveAnimation = null;

let receivedBits = "";
let lastBitTime = 0;

const freqAInput =
    document.getElementById("freqA");

const freqBInput =
    document.getElementById("freqB");

const zeroFrequencyInput =
    document.getElementById("zeroFrequency");

const bitDurationInput =
    document.getElementById("bitDuration");

const toleranceInput =
    document.getElementById("tolerance");


freqAInput.addEventListener(
    "input",
    updateDisplay
);

freqBInput.addEventListener(
    "input",
    updateDisplay
);

zeroFrequencyInput.addEventListener(
    "change",
    updateDisplay
);


function getFrequencies() {

    const freqA =
        Number(freqAInput.value);

    const freqB =
        Number(freqBInput.value);

    if (zeroFrequencyInput.value === "A") {

        return {
            freq0: freqA,
            freq1: freqB
        };

    } else {

        return {
            freq0: freqB,
            freq1: freqA
        };
    }
}


function updateDisplay() {

    const frequencies =
        getFrequencies();

    document.getElementById(
        "zeroDisplay"
    ).textContent =
        frequencies.freq0 + " Hz";

    document.getElementById(
        "oneDisplay"
    ).textContent =
        frequencies.freq1 + " Hz";
}


function textToBinary(text) {

    const bytes =
        new TextEncoder().encode(text);

    let binary = "";

    for (const byte of bytes) {

        binary +=
            byte.toString(2).padStart(8, "0");
    }

    return binary;
}


function binaryToText(binary) {

    const bytes = [];

    for (
        let i = 0;
        i + 8 <= binary.length;
        i += 8
    ) {

        bytes.push(
            parseInt(
                binary.substring(i, i + 8),
                2
            )
        );
    }

    try {

        return new TextDecoder().decode(
            new Uint8Array(bytes)
        );

    } catch {

        return "";
    }
}


async function playFrequency(
    frequency,
    duration
) {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        await audioContext.resume();
    }

    oscillator =
        audioContext.createOscillator();

    gainNode =
        audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.value =
        frequency;

    gainNode.gain.value = 0.15;

    oscillator.connect(gainNode);

    gainNode.connect(
        audioContext.destination
    );

    oscillator.start();

    await new Promise(resolve =>
        setTimeout(resolve, duration)
    );

    try {
        oscillator.stop();
    } catch {}

    try {
        oscillator.disconnect();
        gainNode.disconnect();
    } catch {}
}


async function sendText() {

    if (sending)
        return;

    const text =
        document.getElementById(
            "textToSend"
        ).value;

    if (!text) {

        alert(
            "Enter some text first."
        );

        return;
    }

    const {
        freq0,
        freq1
    } = getFrequencies();

    const duration =
        Number(
            bitDurationInput.value
        );

    const binary =
        textToBinary(text);

    document.getElementById(
        "binaryOutput"
    ).value = binary;

    sending = true;

    document.getElementById(
        "sendStatus"
    ).textContent =
        "Sending...";

    const preamble =
        "1010101010101010";

    const transmission =
        preamble + binary;

    for (
        const bit of transmission
    ) {

        if (!sending)
            break;

        const frequency =
            bit === "0"
                ? freq0
                : freq1;

        await playFrequency(
            frequency,
            duration
        );
    }

    sending = false;

    document.getElementById(
        "sendStatus"
    ).textContent =
        "Finished";
}


function stopSending() {

    sending = false;

    if (oscillator) {

        try {
            oscillator.stop();
        } catch {}

        oscillator = null;
    }

    document.getElementById(
        "sendStatus"
    ).textContent =
        "Stopped";
}


async function startReceiving() {

    try {

        stopReceiving();

        receiveContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        if (
            receiveContext.state ===
            "suspended"
        ) {

            await receiveContext.resume();
        }

        receiveStream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });

        microphone =
            receiveContext
                .createMediaStreamSource(
                    receiveStream
                );

        analyser =
            receiveContext
                .createAnalyser();

        analyser.fftSize = 8192;

        analyser.smoothingTimeConstant =
            0.1;

        microphone.connect(analyser);

        receivedBits = "";
        lastBitTime = 0;

        document.getElementById(
            "receivedBinary"
        ).value = "";

        document.getElementById(
            "receivedText"
        ).value = "";

        document.getElementById(
            "receiveStatus"
        ).textContent =
            "Listening...";

        detectFrequency();

    } catch (error) {

        document.getElementById(
            "receiveStatus"
        ).textContent =
            "Microphone error: " +
            error.message;
    }
}


function getFrequencyStrength(
    data,
    targetFrequency
) {

    const sampleRate =
        receiveContext.sampleRate;

    const fftSize =
        analyser.fftSize;

    const center =
        Math.round(
            targetFrequency *
            fftSize /
            sampleRate
        );

    const tolerance =
        Number(
            toleranceInput.value
        );

    const binWidth =
        sampleRate / fftSize;

    const range =
        Math.max(
            1,
            Math.ceil(
                tolerance /
                binWidth
            )
        );

    let strongest = -Infinity;

    for (
        let i = center - range;
        i <= center + range;
        i++
    ) {

        if (
            i >= 0 &&
            i < data.length
        ) {

            if (
                data[i] > strongest
            ) {

                strongest =
                    data[i];
            }
        }
    }

    return strongest;
}


function detectFrequency() {

    if (!analyser)
        return;

    const {
        freq0,
        freq1
    } = getFrequencies();

    const data =
        new Float32Array(
            analyser.frequencyBinCount
        );

    analyser.getFloatFrequencyData(
        data
    );

    const strength0 =
        getFrequencyStrength(
            data,
            freq0
        );

    const strength1 =
        getFrequencyStrength(
            data,
            freq1
        );

    const threshold = -60;

    let detected = "---";

    if (
        strength0 > threshold &&
        strength0 > strength1
    ) {

        detected =
            Math.round(freq0);

        detectedBit("0");

    } else if (
        strength1 > threshold &&
        strength1 > strength0
    ) {

        detected =
            Math.round(freq1);

        detectedBit("1");
    }

    document.getElementById(
        "detectedFreq"
    ).textContent =
        detected;

    receiveAnimation =
        requestAnimationFrame(
            detectFrequency
        );
}


function detectedBit(bit) {

    const now =
        performance.now();

    const duration =
        Number(
            bitDurationInput.value
        );

    if (
        now - lastBitTime <
        duration * 0.75
    ) {

        return;
    }

    lastBitTime = now;

    receivedBits += bit;

    document.getElementById(
        "receivedBinary"
    ).value =
        receivedBits;

    if (
        receivedBits.length >= 16
    ) {

        const preamble =
            receivedBits.substring(
                0,
                16
            );

        if (
            preamble ===
            "1010101010101010"
        ) {

            const data =
                receivedBits.substring(
                    16
                );

            document.getElementById(
                "receivedText"
            ).value =
                binaryToText(data);
        }
    }
}


function stopReceiving() {

    if (receiveAnimation) {

        cancelAnimationFrame(
            receiveAnimation
        );

        receiveAnimation = null;
    }

    if (microphone) {

        try {
            microphone.disconnect();
        } catch {}

        microphone = null;
    }

    if (receiveStream) {

        receiveStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        receiveStream = null;
    }

    if (receiveContext) {

        try {
            receiveContext.close();
        } catch {}

        receiveContext = null;
    }

    analyser = null;

    document.getElementById(
        "receiveStatus"
    ).textContent =
        "Stopped";

    document.getElementById(
        "detectedFreq"
    ).textContent =
        "---";
}


updateDisplay();

</script>

</body>
</html>
