<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Binary Modem</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        max-width: 900px;
        margin: auto;
        padding: 25px;
    }

    h1 {
        text-align: center;
    }

    .box {
        background: #1d1d1d;
        padding: 20px;
        margin: 15px 0;
        border-radius: 12px;
    }

    textarea, input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        margin: 8px 0;
        background: #292929;
        color: white;
        border: 1px solid #555;
        border-radius: 7px;
    }

    button {
        padding: 12px 18px;
        margin: 5px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-weight: bold;
    }

    .send {
        background: #35c759;
    }

    .receive {
        background: #0a84ff;
        color: white;
    }

    .stop {
        background: #ff453a;
        color: white;
    }

    .status {
        margin-top: 10px;
        padding: 10px;
        background: #080808;
        border-radius: 7px;
        font-family: monospace;
    }

    .freq {
        font-size: 28px;
        text-align: center;
        margin: 15px;
    }
</style>
</head>

<body>

<h1>🔊 Audio Binary Modem</h1>

<div class="box">
    <h2>⚙️ Frequencies</h2>

    <label>Frequency for binary 0 (Hz)</label>
    <input id="freq0" type="number" value="8000">

    <label>Frequency for binary 1 (Hz)</label>
    <input id="freq1" type="number" value="9000">

    <label>Bit duration (milliseconds)</label>
    <input id="bitDuration" type="number" value="150">

    <p>
        <b>0</b> → <span id="show0">8000</span> Hz<br>
        <b>1</b> → <span id="show1">9000</span> Hz
    </p>
</div>

<div class="box">
    <h2>📤 Send Mode</h2>

    <textarea id="textToSend"
        placeholder="Enter text to transmit..."></textarea>

    <button class="send" onclick="sendText()">▶ Send</button>
    <button class="stop" onclick="stopSending()">■ Stop</button>

    <h3>Binary:</h3>

    <textarea id="binaryOutput" readonly></textarea>

    <div class="status" id="sendStatus">
        Ready
    </div>
</div>

<div class="box">
    <h2>📥 Receive Mode</h2>

    <button class="receive" onclick="startReceiving()">
        🎤 Start Listening
    </button>

    <button class="stop" onclick="stopReceiving()">
        ■ Stop Listening
    </button>

    <div class="freq">
        Detected: <span id="detectedFreq">---</span> Hz
    </div>

    <h3>Received Binary:</h3>

    <textarea id="receivedBinary" readonly></textarea>

    <h3>Decoded Text:</h3>

    <textarea id="receivedText" readonly></textarea>

    <div class="status" id="receiveStatus">
        Microphone not running
    </div>
</div>

<script>

let audioContext;
let oscillator;
let gainNode;
let sending = false;

let receiveContext;
let analyser;
let microphone;
let receiveAnimation;

let receivedBits = "";

const freq0Input = document.getElementById("freq0");
const freq1Input = document.getElementById("freq1");

const bitDurationInput =
    document.getElementById("bitDuration");

freq0Input.addEventListener("input", updateDisplay);
freq1Input.addEventListener("input", updateDisplay);

function updateDisplay() {
    document.getElementById("show0").textContent =
        freq0Input.value;

    document.getElementById("show1").textContent =
        freq1Input.value;
}

function textToBinary(text) {

    const bytes =
        new TextEncoder().encode(text);

    let binary = "";

    for (const byte of bytes) {
        binary +=
            byte.toString(2).padStart(8, "0");
    }

    return binary;
}

function binaryToText(binary) {

    let bytes = [];

    for (
        let i = 0;
        i + 8 <= binary.length;
        i += 8
    ) {
        const byte =
            parseInt(binary.substring(i, i + 8), 2);

        bytes.push(byte);
    }

    try {
        return new TextDecoder().decode(
            new Uint8Array(bytes)
        );
    } catch {
        return "";
    }
}

async function playFrequency(frequency, duration) {

    if (!audioContext) {
        audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();
    }

    if (audioContext.state === "suspended") {
        await audioContext.resume();
    }

    oscillator =
        audioContext.createOscillator();

    gainNode =
        audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = frequency;
    gainNode.gain.value = 0.15;

    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);

    oscillator.start();

    await new Promise(resolve =>
        setTimeout(resolve, duration)
    );

    try {
        oscillator.stop();
    } catch {}

    oscillator.disconnect();
    gainNode.disconnect();
}

async function sendText() {

    if (sending)
        return;

    const text =
        document.getElementById("textToSend").value;

    if (!text) {
        alert("Enter some text first.");
        return;
    }

    const freq0 =
        Number(freq0Input.value);

    const freq1 =
        Number(freq1Input.value);

    const duration =
        Number(bitDurationInput.value);

    const binary =
        textToBinary(text);

    document.getElementById("binaryOutput")
        .value = binary;

    sending = true;

    document.getElementById("sendStatus")
        .textContent =
        "Sending " + binary.length + " bits...";

    const transmission =
        "10101010" + binary;

    for (const bit of transmission) {

        if (!sending)
            break;

        if (bit === "0") {

            await playFrequency(
                freq0,
                duration
            );

        } else {

            await playFrequency(
                freq1,
                duration
            );
        }
    }

    sending = false;

    document.getElementById("sendStatus")
        .textContent =
        "Transmission finished.";
}

function stopSending() {

    sending = false;

    if (oscillator) {

        try {
            oscillator.stop();
        } catch {}

        oscillator = null;
    }

    document.getElementById("sendStatus")
        .textContent =
        "Transmission stopped.";
}

async function startReceiving() {

    try {

        receiveContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio: true
                });

        microphone =
            receiveContext.createMediaStreamSource(
                stream
            );

        analyser =
            receiveContext.createAnalyser();

        analyser.fftSize = 4096;

        microphone.connect(analyser);

        receivedBits = "";

        document.getElementById("receivedBinary")
            .value = "";

        document.getElementById("receivedText")
            .value = "";

        document.getElementById("receiveStatus")
            .textContent =
            "Listening...";

        detectFrequency();

    } catch (error) {

        document.getElementById("receiveStatus")
            .textContent =
            "Microphone error: " + error.message;
    }
}

function detectFrequency() {

    if (!analyser)
        return;

    const bufferLength =
        analyser.frequencyBinCount;

    const data =
        new Float32Array(bufferLength);

    analyser.getFloatFrequencyData(data);

    let strongestIndex = 0;
    let strongestValue = -Infinity;

    for (
        let i = 1;
        i < bufferLength;
        i++
    ) {

        if (data[i] > strongestValue) {

            strongestValue =
                data[i];

            strongestIndex = i;
        }
    }

    const frequency =
        strongestIndex *
        receiveContext.sampleRate /
        analyser.fftSize;

    document.getElementById("detectedFreq")
        .textContent =
        Math.round(frequency);

    const f0 =
        Number(freq0Input.value);

    const f1 =
        Number(freq1Input.value);

    const distance0 =
        Math.abs(frequency - f0);

    const distance1 =
        Math.abs(frequency - f1);

    const tolerance = 300;

    if (
        distance0 < tolerance &&
        distance0 < distance1
    ) {
        detectedBit("0");

    } else if (
        distance1 < tolerance &&
        distance1 < distance0
    ) {
        detectedBit("1");
    }

    receiveAnimation =
        requestAnimationFrame(
            detectFrequency
        );
}

let lastBitTime = 0;

function detectedBit(bit) {

    const now = performance.now();

    const duration =
        Number(bitDurationInput.value);

    if (
        now - lastBitTime <
        duration * 0.75
    ) {
        return;
    }

    lastBitTime = now;

    receivedBits += bit;

    document.getElementById("receivedBinary")
        .value = receivedBits;

    if (receivedBits.length >= 8) {

        const data =
            receivedBits.substring(8);

        document.getElementById("receivedText")
            .value =
            binaryToText(data);
    }
}

function stopReceiving() {

    if (receiveAnimation) {

        cancelAnimationFrame(
            receiveAnimation
        );

        receiveAnimation = null;
    }

    if (microphone) {

        microphone.disconnect();
        microphone = null;
    }

    if (receiveContext) {

        receiveContext.close();
        receiveContext = null;
    }

    document.getElementById("receiveStatus")
        .textContent =
        "Listening stopped.";

    document.getElementById("detectedFreq")
        .textContent = "---";
}

</script>

</body>
</html>
