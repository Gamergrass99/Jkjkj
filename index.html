<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Calculator</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f2f2f2;
margin:0;
padding:20px;
}
.container{
max-width:500px;
margin:auto;
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}
h2{
text-align:center;
}
input{
width:100%;
padding:12px;
margin:8px 0;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}
table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}
th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}
th{
background:#1976D2;
color:white;
}
</style>
</head>

<body>

<div class="container">

<h2>Gravity Experiment Calculator</h2>

<input id="h" type="number" step="any" placeholder="Height H (m)" oninput="calc()">

<input id="t1" type="number" step="any" placeholder="Time T1 (s)" oninput="calc()">
<input id="t2" type="number" step="any" placeholder="Time T2 (s)" oninput="calc()">
<input id="t3" type="number" step="any" placeholder="Time T3 (s)" oninput="calc()">
<input id="t4" type="number" step="any" placeholder="Time T4 (s)" oninput="calc()">
<input id="t5" type="number" step="any" placeholder="Time T5 (s)" oninput="calc()">

<table>
<tr>
<th>Trial</th>
<th>Time (s)</th>
<th>T² (s²)</th>
<th>g (m/s²)</th>
</tr>
<tbody id="result"></tbody>
<tfoot id="avg"></tfoot>
</table>

</div>

<script>
function calc(){

let h=parseFloat(document.getElementById("h").value);

let html="";
let sumT=0,sumT2=0,sumG=0,count=0;

for(let i=1;i<=5;i++){

let t=parseFloat(document.getElementById("t"+i).value);

if(!isNaN(t)&&!isNaN(h)){

let t2=t*t;
let g=(8*h)/t2;

html+=`
<tr>
<td>${i}</td>
<td>${t.toFixed(3)}</td>
<td>${t2.toFixed(3)}</td>
<td>${g.toFixed(3)}</td>
</tr>
`;

sumT+=t;
sumT2+=t2;
sumG+=g;
count++;
}
}

document.getElementById("result").innerHTML=html;

if(count>0){
document.getElementById("avg").innerHTML=`
<tr style="font-weight:bold;background:#e8f5e9;">
<td>Average</td>
<td>${(sumT/count).toFixed(3)}</td>
<td>${(sumT2/count).toFixed(3)}</td>
<td>${(sumG/count).toFixed(3)}</td>
</tr>`;
}else{
document.getElementById("avg").innerHTML="";
}

}
</script>

</body>
</html>
