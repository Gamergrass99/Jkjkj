<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Binary Modem</title>
</head>

<body>

<h1>Audio Binary Modem</h1>

<h2>Send</h2>

<label>Frequency for 0 (Hz):</label>
<input id="sendFreq0" type="number" value="8000">
<br><br>

<label>Frequency for 1 (Hz):</label>
<input id="sendFreq1" type="number" value="9000">
<br><br>

<label>Bit duration (ms):</label>
<input id="sendBitDuration" type="number" value="200">
<br><br>

<label>Text to send:</label><br>
<textarea id="textToSend" rows="5" cols="50"></textarea>
<br><br>

<button onclick="sendText()">Send</button>
<button onclick="stopSending()">Stop Sending</button>

<p>Status: <span id="sendStatus">Ready</span></p>

<label>Binary:</label><br>
<textarea id="binaryOutput" rows="5" cols="50" readonly></textarea>


<hr>


<h2>Receive</h2>

<label>Listen for 0 (Hz):</label>
<input id="receiveFreq0" type="number" value="8000">
<br><br>

<label>Listen for 1 (Hz):</label>
<input id="receiveFreq1" type="number" value="9000">
<br><br>

<label>Bit duration (ms):</label>
<input id="receiveBitDuration" type="number" value="200">
<br><br>

<label>Frequency tolerance (Hz):</label>
<input id="receiveTolerance" type="number" value="100">
<br><br>

<button onclick="startReceiving()">
    Start Listening
</button>

<button onclick="stopReceiving()">
    Stop Listening
</button>

<p>
    Detected:
    <span id="detectedFreq">---</span> Hz
</p>

<p>
    Receiver status:
    <span id="receiveStatus">Stopped</span>
</p>

<label>Received Binary:</label><br>
<textarea id="receivedBinary" rows="5" cols="50" readonly></textarea>

<br><br>

<label>Decoded Text:</label><br>
<textarea id="receivedText" rows="5" cols="50" readonly></textarea>


<hr>


<h2>Send + Listen</h2>

<p>
This mode starts the microphone first and then sends the text.
</p>

<button onclick="sendAndListen()">
    Send + Listen
</button>

<button onclick="stopEverything()">
    Stop Everything
</button>


<script>

let audioContext = null;
let oscillator = null;
let gainNode = null;

let sending = false;

let receiveContext = null;
let analyser = null;
let microphone = null;
let receiveStream = null;

let receiving = false;
let receiveTimer = null;

let receivedBits = "";
let receiveStartTime = 0;


function textToBinary(text) {

    const bytes =
        new TextEncoder().encode(text);

    let binary = "";

    for (const byte of bytes) {

        binary +=
            byte.toString(2).padStart(8, "0");
    }

    return binary;
}


function binaryToText(binary) {

    const bytes = [];

    for (
        let i = 0;
        i + 8 <= binary.length;
        i += 8
    ) {

        bytes.push(
            parseInt(
                binary.substring(i, i + 8),
                2
            )
        );
    }

    try {

        return new TextDecoder().decode(
            new Uint8Array(bytes)
        );

    } catch {

        return "";
    }
}


async function createAudioContext() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if (
        audioContext.state === "suspended"
    ) {

        await audioContext.resume();
    }
}


async function playFrequency(
    frequency,
    duration
) {

    await createAudioContext();

    oscillator =
        audioContext.createOscillator();

    gainNode =
        audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.value =
        frequency;

    gainNode.gain.value = 0.15;

    oscillator.connect(gainNode);

    gainNode.connect(
        audioContext.destination
    );

    oscillator.start();

    await new Promise(resolve =>
        setTimeout(resolve, duration)
    );

    try {
        oscillator.stop();
    } catch {}

    try {
        oscillator.disconnect();
        gainNode.disconnect();
    } catch {}

    oscillator = null;
    gainNode = null;
}


async function sendText() {

    if (sending)
        return;

    const text =
        document.getElementById(
            "textToSend"
        ).value;

    if (!text) {

        alert("Enter some text first.");

        return;
    }

    const freq0 =
        Number(
            document.getElementById(
                "sendFreq0"
            ).value
        );

    const freq1 =
        Number(
            document.getElementById(
                "sendFreq1"
            ).value
        );

    const duration =
        Number(
            document.getElementById(
                "sendBitDuration"
            ).value
        );

    if (
        freq0 <= 0 ||
        freq1 <= 0 ||
        duration <= 0
    ) {

        alert("Enter valid settings.");

        return;
    }

    const binary =
        textToBinary(text);

    document.getElementById(
        "binaryOutput"
    ).value = binary;

    const preamble =
        "1010101010101010";

    const transmission =
        preamble + binary;

    sending = true;

    document.getElementById(
        "sendStatus"
    ).textContent =
        "Sending...";

    for (
        const bit of transmission
    ) {

        if (!sending)
            break;

        const frequency =
            bit === "0"
                ? freq0
                : freq1;

        await playFrequency(
            frequency,
            duration
        );
    }

    sending = false;

    document.getElementById(
        "sendStatus"
    ).textContent =
        "Finished";
}


function stopSending() {

    sending = false;

    if (oscillator) {

        try {
            oscillator.stop();
        } catch {}

        oscillator = null;
    }

    if (gainNode) {

        try {
            gainNode.disconnect();
        } catch {}

        gainNode = null;
    }

    document.getElementById(
        "sendStatus"
    ).textContent =
        "Stopped";
}


async function startReceiving() {

    try {

        stopReceiving();

        receiveContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        await receiveContext.resume();

        receiveStream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });

        microphone =
            receiveContext
                .createMediaStreamSource(
                    receiveStream
                );

        analyser =
            receiveContext
                .createAnalyser();

        analyser.fftSize = 8192;

        analyser.smoothingTimeConstant = 0;

        microphone.connect(analyser);

        receivedBits = "";

        document.getElementById(
            "receivedBinary"
        ).value = "";

        document.getElementById(
            "receivedText"
        ).value = "";

        document.getElementById(
            "detectedFreq"
        ).textContent = "---";

        document.getElementById(
            "receiveStatus"
        ).textContent =
            "Listening...";

        receiving = true;

        receiveStartTime =
            performance.now();

        receiveTimer =
            setTimeout(
                receiveBit,
                100
            );

    } catch (error) {

        document.getElementById(
            "receiveStatus"
        ).textContent =
            "Microphone error: " +
            error.message;
    }
}


function getStrength(
    data,
    frequency
) {

    const sampleRate =
        receiveContext.sampleRate;

    const fftSize =
        analyser.fftSize;

    const tolerance =
        Number(
            document.getElementById(
                "receiveTolerance"
            ).value
        );

    const center =
        Math.round(
            frequency *
            fftSize /
            sampleRate
        );

    const binWidth =
        sampleRate / fftSize;

    const range =
        Math.max(
            1,
            Math.ceil(
                tolerance /
                binWidth
            )
        );

    let strongest =
        -Infinity;

    for (
        let i = center - range;
        i <= center + range;
        i++
    ) {

        if (
            i >= 0 &&
            i < data.length
        ) {

            if (
                data[i] > strongest
            ) {

                strongest =
                    data[i];
            }
        }
    }

    return strongest;
}


function receiveBit() {

    if (
        !receiving ||
        !analyser
    ) {

        return;
    }

    const freq0 =
        Number(
            document.getElementById(
                "receiveFreq0"
            ).value
        );

    const freq1 =
        Number(
            document.getElementById(
                "receiveFreq1"
            ).value
        );

    const duration =
        Number(
            document.getElementById(
                "receiveBitDuration"
            ).value
        );

    const data =
        new Float32Array(
            analyser.frequencyBinCount
        );

    analyser.getFloatFrequencyData(
        data
    );

    const strength0 =
        getStrength(
            data,
            freq0
        );

    const strength1 =
        getStrength(
            data,
            freq1
        );

    const threshold = -65;

    let bit = null;

    if (
        strength0 > threshold &&
        strength0 > strength1
    ) {

        bit = "0";

        document.getElementById(
            "detectedFreq"
        ).textContent =
            Math.round(freq0);

    } else if (
        strength1 > threshold &&
        strength1 > strength0
    ) {

        bit = "1";

        document.getElementById(
            "detectedFreq"
        ).textContent =
            Math.round(freq1);

    } else {

        document.getElementById(
            "detectedFreq"
        ).textContent =
            "---";
    }

    if (bit !== null) {

        receivedBits += bit;

        document.getElementById(
            "receivedBinary"
        ).value =
            receivedBits;

        decodeReceivedData();
    }

    receiveTimer =
        setTimeout(
            receiveBit,
            duration
        );
}


function decodeReceivedData() {

    if (
        receivedBits.length < 16
    ) {

        return;
    }

    const preamble =
        receivedBits.substring(
            0,
            16
        );

    if (
        preamble !==
        "1010101010101010"
    ) {

        return;
    }

    const data =
        receivedBits.substring(
            16
        );

    document.getElementById(
        "receivedText"
    ).value =
        binaryToText(data);
}


function stopReceiving() {

    receiving = false;

    if (receiveTimer) {

        clearTimeout(
            receiveTimer
        );

        receiveTimer = null;
    }

    if (microphone) {

        try {
            microphone.disconnect();
        } catch {}

        microphone = null;
    }

    if (receiveStream) {

        receiveStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        receiveStream = null;
    }

    if (receiveContext) {

        try {
            receiveContext.close();
        } catch {}

        receiveContext = null;
    }

    analyser = null;

    document.getElementById(
        "receiveStatus"
    ).textContent =
        "Stopped";

    document.getElementById(
        "detectedFreq"
    ).textContent =
        "---";
}


async function sendAndListen() {

    const text =
        document.getElementById(
            "textToSend"
        ).value;

    if (!text) {

        alert("Enter text first.");

        return;
    }

    await startReceiving();

    await new Promise(resolve =>
        setTimeout(resolve, 500)
    );

    await sendText();
}


function stopEverything() {

    stopSending();
    stopReceiving();
}

</script>

</body>
</html>
